<body class="bg-background text-on-surface min-h-screen">
<!-- Shell Suppression applied: Transactional screens (Password Reset) do not show TopAppBar or SideNavBar per instructions -->
<main class="min-h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Visual Anchor (Split Screen) -->

<div class="absolute inset-0 opacity-20 pointer-events-none bg-custom-pattern"></div>

<div class="relative z-10 w-full max-w-lg aspect-square flex items-center justify-center">
<div class="w-full h-full rounded-full bg-primary/5 absolute animate-pulse blur-3xl"></div>
<img class="w-full h-full object-contain relative z-20 transition-transform duration-1000 hover:scale-105" data-alt="A sophisticated abstract digital composition inspired by network circuitry and organic growth. The art features rounded shapes in shades of sage green, forest green, and earthy tan, connected by precise clean lines on a minimalist cream background. The aesthetic is clean, professional, and tranquil, embodying a digital sanctuary with soft shadows and balanced proportions." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAIRmzaeaU6J9isYX47fPbKDr3CFIfNv_kTucw85cDv05qPoo8rxdYNW3tktv10gm-tZaM5-Da-lo2wbsS5fjKBh3j2C3P50IzTlbve4_Zetj0V9ApcnKmbLrztAOyeAewBiZO8kR8OrsmZxiEUysbe7ehMMiIhLozoISg2k-lbtViNSFeejRfEeTyLezMEFlszrRDS-nXXJQ6eyYdhuXqQlYsdp5kI7rioG-wWQyLYEXPukA3wD0uLXw"/>
</div>

<span class="material-symbols-outlined text-primary text-[32px]">shield_person</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Digital Sanctuary BMS</span>
</div>
</section>
<!-- Right Side: Authentication Canvas -->
<section class="w-full md:w-1/2 flex items-center justify-center p-md md:p-xl bg-background">
<!-- Focused Interaction Card -->
<div class="w-full max-w-md bg-surface rounded-xl border border-border-subtle shadow-sm p-lg flex flex-col gap-xl">
<!-- Header Content -->
<div class="flex flex-col gap-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Create a new password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose a strong password to secure your account.</p>
</div>
<!-- Reset Password Form -->
<form class="flex flex-col gap-lg" id="resetForm" onsubmit="event.preventDefault();">
<!-- Password Field Group -->
<div class="flex flex-col gap-md">
<!-- New Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="new_password">New Password</label>
<div class="relative group">
<input class="w-full h-12 px-md bg-surface border border-border-subtle rounded-xl font-body-md focus:ring-2 focus:ring-primary/20 focus:border-secondary transition-all outline-none" id="new_password" placeholder="Enter new password" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('new_password')" type="button">
<span class="material-symbols-outlined" id="new_password_icon">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Confirm Password</label>
<div class="relative group">
<input class="w-full h-12 px-md bg-surface border border-border-subtle rounded-xl font-body-md focus:ring-2 focus:ring-primary/20 focus:border-secondary transition-all outline-none" id="confirm_password" placeholder="Confirm new password" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('confirm_password')" type="button">
<span class="material-symbols-outlined" id="confirm_password_icon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Live Strength Indicator -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Password Strength</span>
<span class="font-label-sm text-label-sm text-status-success font-bold">Strong</span>
</div>
<div class="h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden flex gap-0.5">
<div class="h-full w-1/4 bg-status-success rounded-full"></div>
<div class="h-full w-1/4 bg-status-success rounded-full"></div>
<div class="h-full w-1/4 bg-status-success rounded-full"></div>
<div class="h-full w-1/4 bg-status-success/30 rounded-full"></div>
</div>

<span class="font-body-sm text-body-sm text-on-surface">8+ characters</span>

<div class="flex items-center gap-sm">

</div>

<span>Reset Password</span>
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
</button>
</form>

<a class="font-label-md text-label-md text-primary hover:underline flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Back to sign in
                    </a>
</div>
</div>

</main>
<script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + '_icon');
            if (field.type === 'password') {
                field.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                field.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Minimalist interactive feedback
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
            });
        });
    </script>
