<body class="overflow-hidden">
<!-- Background Screen Simulation (Reports Workspace) -->
<div class="fixed inset-0 z-0 flex overflow-hidden">
<!-- SideNavBar -->
<aside class="flex flex-col h-full border-r border-outline-variant bg-surface-container-low w-[240px] h-screen sticky left-0 top-0">
<div class="p-lg">
<div class="font-headline-sm text-headline-sm font-bold text-primary">BMS Pro</div>
<div class="font-body-md text-body-md text-on-surface-variant">Enterprise Edition</div>
</div>
<nav class="flex-1 mt-md px-sm">
<div class="space-y-1">
<a class="flex items-center gap-3 px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-colors" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-body-md text-body-md">Dashboard</span>
</a>
<a class="flex items-center gap-3 px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-colors" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-body-md text-body-md">Products</span>
</a>
<a class="flex items-center gap-3 px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-colors" href="#">
<span class="material-symbols-outlined">warehouse</span>
<span class="font-body-md text-body-md">Inventory</span>
</a>
<a class="flex items-center gap-3 px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-colors" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-body-md text-body-md">Sales</span>
</a>
<a class="flex items-center gap-3 px-md py-sm rounded-lg relative text-primary font-semibold before:content-[''] before:absolute before:left-0 before:top-1/2 before:-translate-y-1/2 before:h-8 before:w-1 before:bg-primary before:rounded-r-full bg-surface-container-highest" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="font-body-md text-body-md">Reports</span>
</a>
</div>
</nav>
<div class="p-sm mt-auto border-t border-outline-variant">
<a class="flex items-center gap-3 px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-highest transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-body-md text-body-md">Settings</span>
</a>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-w-0">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-desktop py-4 bg-surface border-b border-outline-variant sticky top-0 z-40">
<div class="flex items-center gap-lg">
<h1 class="font-headline-md text-headline-md text-on-surface font-bold">Reports</h1>
<div class="hidden md:flex items-center gap-md">
<span class="text-primary font-bold border-b-2 border-primary pb-1">Reports</span>
</div>
</div>
<div class="flex items-center gap-md">
<button class="px-lg py-2 rounded-xl border border-primary text-primary font-semibold hover:bg-surface-container transition-colors">Schedule Report</button>
<button class="px-lg py-2 rounded-xl bg-primary text-on-primary font-semibold hover:opacity-90 transition-opacity">Export</button>
<div class="flex items-center gap-sm ml-md">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">notifications</span>
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">account_circle</span>
</div>
</div>
</header>
<div class="p-margin-desktop space-y-lg">
<div class="grid grid-cols-12 gap-gutter">
<!-- Placeholder Card -->
<div class="col-span-8 bg-surface p-lg rounded-xl border border-outline-variant h-96">
<div class="h-4 w-48 bg-surface-container rounded mb-md"></div>
<div class="space-y-xs">
<div class="h-12 w-full bg-surface-container-low rounded"></div>
<div class="h-12 w-full bg-surface-container-low rounded"></div>
<div class="h-12 w-full bg-surface-container-low rounded"></div>
<div class="h-12 w-full bg-surface-container-low rounded"></div>
</div>
</div>
<!-- Placeholder Card -->
<div class="col-span-4 bg-surface p-lg rounded-xl border border-outline-variant h-96">
<div class="h-4 w-32 bg-surface-container rounded mb-md"></div>
<div class="flex flex-col items-center justify-center h-64 gap-sm">
<div class="w-32 h-32 rounded-full border-8 border-surface-container-high border-t-primary"></div>
<div class="h-4 w-24 bg-surface-container rounded"></div>
</div>
</div>
</div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-overlay transition-opacity duration-300" id="modalOverlay">
<!-- Modal Content -->
<div class="bg-surface-container-lowest w-full max-w-[480px] rounded-xl shadow-[0px_4px_12px_rgba(45,42,38,0.08)] border border-outline-variant overflow-hidden animate-in fade-in zoom-in duration-200">
<!-- Modal Header -->
<div class="px-xl py-lg border-b border-outline-variant">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Schedule Report</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Set up automated report delivery to your email.</p>
</div>
<!-- Modal Form Body -->
<div class="px-xl py-xl space-y-lg">
<!-- Select Report -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Select Report</label>
<div class="relative">
<select class="w-full h-[48px] px-md py-sm bg-surface-container-low border-0 rounded-xl font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-white appearance-none">
<option>Business Overview</option>
<option>Sales Report</option>
<option>Inventory Summary</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Frequency Segmented Control -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Frequency</label>
<div class="flex p-xs bg-surface-container rounded-xl gap-xs">
<button class="flex-1 py-sm px-md rounded-[10px] font-body-md text-body-md text-on-surface bg-white shadow-sm border border-outline-variant/10">Daily</button>
<button class="flex-1 py-sm px-md rounded-[10px] font-body-md text-body-md text-on-surface-variant hover:bg-surface-container-high transition-colors">Weekly</button>
<button class="flex-1 py-sm px-md rounded-[10px] font-body-md text-body-md text-on-surface-variant hover:bg-surface-container-high transition-colors">Monthly</button>
</div>
</div>
<!-- Recipient Email -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Recipient Email</label>
<input class="w-full h-[48px] px-md py-sm bg-surface-container-low border-0 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-white" placeholder="e.g. analytics@company.com" type="email"/>
</div>
<!-- Format -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Format</label>
<div class="relative">
<select class="w-full h-[48px] px-md py-sm bg-surface-container-low border-0 rounded-xl font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-white appearance-none">
<option>PDF Document (.pdf)</option>
<option>Excel Spreadsheet (.xlsx)</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Modal Footer Actions -->
<div class="px-xl py-lg bg-surface-container-low flex items-center justify-end gap-md">
<button class="px-xl h-[44px] rounded-xl border border-primary text-primary font-semibold hover:bg-surface-container-highest transition-all active:scale-[0.98]" onclick="closeModal()">
                    Cancel
                </button>
<button class="px-xl h-[44px] rounded-xl bg-primary text-on-primary font-semibold hover:opacity-90 transition-all active:scale-[0.98] flex items-center gap-2" onclick="saveSchedule()">
                    Save Schedule
                </button>
</div>
</div>
</div>
<script>
        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.add('opacity-0');
            modal.style.pointerEvents = 'none';
            // In a real app, this might navigate back or hide the element
            console.log('Modal closed');
        }

        function saveSchedule() {
            // Success interaction
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check</span> Saved';
                btn.classList.replace('bg-primary', 'bg-secondary');
                setTimeout(() => closeModal(), 1000);
            }, 1500);
        }

        // Handle escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body></html>
