<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Supermarket POS - Cash Payment</title>
<!-- Tailwind CSS v3 CDN with required plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-styling">
    /* Custom overlay and modal positioning to ensure depth */
    .modal-overlay {
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
    }
    /* Specific styling for the amount due to match the font weight and color in the reference */
    .amount-due-text {
      color: #1D4ED8; /* Blue-700 equivalent */
    }
    /* Change display background */
    .change-display {
      background-color: #F0FDF4; /* Green-50 */
    }
    .change-text {
      color: #166534; /* Green-800 */
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased overflow-hidden">
<!-- BEGIN: POS Background Simulation -->
<!-- This represents the underlying POS screen which is dimmed by the modal -->
<div aria-hidden="true" class="fixed inset-0 flex flex-col h-screen">
<!-- Header -->
<header class="bg-white border-b px-6 py-3 flex items-center justify-between">
<div class="flex items-center gap-4">
<svg class="w-8 h-8 text-blue-600" fill="currentColor" viewbox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path></svg>
<h1 class="text-xl font-bold text-gray-800">Supermarket POS</h1>
</div>
<div class="flex items-center gap-6 text-sm text-gray-500">
<span>Good morning, <strong>Jane</strong></span>
<span>•</span>
<span>Till 2</span>
<span class="flex items-center gap-2">
<span class="w-2 h-2 bg-green-500 rounded-full"></span>
          Online
        </span>
</div>
<div class="w-10 h-10 bg-blue-700 rounded-full flex items-center justify-center text-white font-semibold">JM</div>
</header>
<main class="flex-1 flex overflow-hidden">
<!-- Left Panel: Shopping Cart & Search -->
<section class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">
<div class="relative">
<input class="w-full pl-12 pr-12 py-3 border border-gray-300 rounded-lg bg-white shadow-sm" placeholder="Search product, SKU, or type barcode..." type="text"/>
<svg class="absolute left-4 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<svg class="absolute right-4 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<div>
<h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Frequent Items</h2>
<div class="grid grid-cols-4 gap-4">
<div class="bg-white p-4 border rounded-lg text-center shadow-sm">
<div class="text-sm font-semibold">Soda 500ml</div>
<div class="text-xs text-gray-500">KES 80</div>
</div>
<div class="bg-white p-4 border rounded-lg text-center shadow-sm">
<div class="text-sm font-semibold">Bread 400g</div>
<div class="text-xs text-gray-500">KES 70</div>
</div>
</div>
</div>
</section>
<!-- Right Panel: Checkout Summary -->
<aside class="w-96 bg-gray-50 border-l p-6 flex flex-col gap-6">
<div class="space-y-4">
<h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Customer</h2>
<button class="w-full flex items-center justify-between p-3 border rounded-lg bg-white">
<div class="flex items-center gap-2">
<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>Walk-in customer</span>
</div>
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<div class="border-t pt-4 space-y-2">
<div class="flex justify-between text-gray-600">
<span>Subtotal (6 items)</span>
<span>KES 1,540.00</span>
</div>
<div class="flex justify-between text-gray-600">
<span>VAT (16%)</span>
<span>KES 246.40</span>
</div>
<div class="mt-4 pt-4 border-t">
<span class="text-xs font-bold text-gray-500 uppercase">Total Due</span>
<div class="text-3xl font-bold text-blue-700 mt-1">KES 1,786.40</div>
</div>
</div>
</aside>
</main>
</div>
<!-- END: POS Background Simulation -->
<!-- BEGIN: Modal Backdrop -->
<div class="fixed inset-0 modal-overlay z-40 flex items-center justify-center p-4">
<!-- BEGIN: Cash Payment Modal Container -->
<div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col" data-purpose="payment-modal">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-4 border-b">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-green-100 text-green-600 rounded-lg flex items-center justify-center">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h2 class="text-xl font-bold text-gray-900">Cash Payment</h2>
</div>
<button class="text-gray-400 hover:text-gray-600">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<!-- Modal Body -->
<div class="px-8 py-6 space-y-6">
<!-- Amount Due Section -->
<div data-purpose="amount-due-summary">
<p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Amount Due</p>
<p class="text-4xl font-bold amount-due-text">KES 1,786.40</p>
</div>
<hr class="border-gray-100"/>
<!-- Cash Received Section -->
<div data-purpose="input-section">
<label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Cash Received</label>
<!-- Input with Symbol -->
<div class="relative mb-4">
<div class="absolute inset-y-0 left-0 flex items-center px-4 border-r bg-blue-50 text-blue-700 font-bold rounded-l-lg border-blue-600">
              KES
            </div>
<input class="block w-full pl-16 pr-4 py-4 border-2 border-blue-600 rounded-lg text-lg focus:ring-0 focus:border-blue-600 placeholder-gray-300" placeholder="Enter amount received" type="text"/>
</div>
<!-- Quick Select Buttons -->
<div class="grid grid-cols-4 gap-2">
<button class="py-3 px-1 border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50 text-sm">KES 2,000</button>
<button class="py-3 px-1 border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50 text-sm">KES 5,000</button>
<button class="py-3 px-1 border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50 text-sm">KES 10,000</button>
<button class="py-3 px-1 border border-gray-200 rounded-lg font-bold text-gray-700 hover:bg-gray-50 text-sm">Other</button>
</div>
</div>
<!-- Change Display Section -->
<div class="change-display rounded-lg p-5" data-purpose="change-result">
<p class="text-xs font-bold text-green-700 uppercase tracking-widest mb-1">Change</p>
<p class="text-2xl font-bold change-text">KES 0.00</p>
</div>
</div>
<!-- Modal Footer / Actions -->
<div class="px-8 pb-8 pt-2 flex gap-4">
<button class="flex-1 py-4 border-2 border-gray-200 rounded-xl font-bold text-gray-700 hover:bg-gray-50 transition-colors">
          Back
        </button>
<button class="flex-[1.5] py-4 bg-blue-700 rounded-xl font-bold text-white hover:bg-blue-800 transition-colors">
          Complete Sale
        </button>
</div>
</div>
<!-- END: Cash Payment Modal Container -->
</div>
<!-- END: Modal Backdrop -->
</body></html>
