</div>
</div>

<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-padding">
<!-- Logout Confirmation Card -->
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm flex flex-col items-center text-center animate-in fade-in zoom-in duration-300">
<!-- Branding/Icon Anchor -->
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'wght' 300;">logout</span>
</div>
<!-- Header -->
<h2 class="font-headline-md text-headline-md text-primary mb-2">Log Out</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-10 max-w-[280px]">
                Are you sure you want to log out? You will need to sign in again to access your workspace.
            </p>
<!-- Actions Cluster -->
<div class="w-full flex flex-col gap-4">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-md text-label-md hover:opacity-90 transition-all-custom active:scale-[0.98] flex items-center justify-center" onclick="window.location.reload()">
                    Log Out
                </button>
<button class="w-full h-12 bg-transparent text-on-surface-variant border border-transparent font-label-md text-label-md hover:bg-surface-container-low transition-all-custom active:scale-[0.98] rounded-lg" onclick="window.history.back()">
                    Cancel
                </button>
</div>
</div>
</main>
<!-- Bottom Context Section (Optional subtle branding) -->
<footer class="p-container-padding flex justify-center mb-8">
<p class="font-label-md text-label-md text-outline opacity-50">BMS Management Suite © 2024</p>
</footer>
<!-- Bottom Navigation (Suppressed per "Relevance Check" - Logout is a task-focused departure) -->
<script>
        // Simple micro-interaction for the primary button
        document.querySelector('button.bg-primary').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                alert('Session ended successfully.');
            }, 800);
        });

        // Atmospheric subtle motion on the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.max-w-md');
            if (card) {
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            }
        });
    </script>
