<body class="bg-background text-on-surface w-full min-h-screen relative overflow-hidden flex">
<!-- Background Mock -->
<div class="absolute inset-0 z-0">
<iframe class="w-full h-full border-none pointer-events-none opacity-40" src="{{DATA:SCREEN:SCREEN_2}}"></iframe>
</div>
<!-- Dimmer Overlay -->
<div class="absolute inset-0 bg-on-surface/40 z-10 backdrop-blur-md flex items-center justify-center p-4">
<!-- Modal Card -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-2xl flex flex-col max-h-[90vh] border border-outline-variant/50">
<!-- Modal Header -->
<div class="flex justify-between items-center p-6 border-b border-outline-variant/30 shrink-0">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface font-bold">Add New Supplier</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Enter the supplier's information to add them to your directory.</p>
</div>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors text-on-surface-variant h-fit flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-6 overflow-y-auto grow flex flex-col gap-10 flex-1">
<!-- Section 1: Basic Information -->
<section>
<h3 class="font-label-caps text-label-caps text-primary mb-4 border-b border-outline-variant/30 pb-2 flex items-center gap-2 font-bold uppercase">
<span class="material-symbols-outlined text-[16px]">business</span>
    Basic Information
</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
<div class="col-span-1 md:col-span-2">
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Supplier Name</label>
<input class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-t-md" placeholder="e.g. Acme Corp" type="text"/>
</div>
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Category</label>
<select class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-t-md appearance-none">
<option disabled="" selected="" value="">Select category</option>
<option value="logistics">Logistics</option>
<option value="raw_materials">Raw Materials</option>
<option value="packaging">Packaging</option>
<option value="equipment">Equipment</option>
<option value="services">Services</option>
</select>
<p class="text-[11px] text-on-surface-variant mt-1">Classify the supplier for easier filtering.</p>
</div>
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Tax ID / VAT Number</label>
<input class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-t-md" placeholder="Optional" type="text"/>
<p class="text-[11px] text-on-surface-variant mt-1">Used for invoicing and compliance.</p>
</div>
</div>
</section>
<!-- Section 2: Primary Contact -->
<section>
<h3 class="font-label-caps text-label-caps text-primary mb-4 border-b border-outline-variant/30 pb-2 flex items-center gap-2 font-bold uppercase">
<span class="material-symbols-outlined text-[16px]">person</span>
    Primary Contact
</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
<div class="col-span-1 md:col-span-2">
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Full Name</label>
<input class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-t-md" placeholder="Contact person's name" type="text"/>
</div>
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Email Address</label>
<input class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-t-md" placeholder="contact@example.com" type="email"/>
</div>
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Phone Number</label>
<input class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors rounded-t-md" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</section>
<!-- Section 3: Address -->
<section>
<h3 class="font-label-caps text-label-caps text-primary mb-4 border-b border-outline-variant/30 pb-2 flex items-center gap-2 font-bold uppercase">
<span class="material-symbols-outlined text-[16px]">map</span>
    Address
</h3>
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-1.5 font-medium">Business Address</label>
<textarea class="w-full bg-surface-container-low/50 border-0 border-b-2 border-outline-variant/50 px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors resize-none rounded-t-md" placeholder="Full business address" rows="3"></textarea>
</div>
</section>
</div>
<!-- Modal Footer -->
<div class="p-6 border-t border-outline-variant/30 flex justify-end gap-3 shrink-0 bg-surface/50 rounded-b-xl">
<button class="px-5 py-2.5 font-body-md text-body-md font-medium text-on-surface-variant hover:bg-surface-container-low rounded-lg transition-colors">
                    Cancel
                </button>
<button class="px-6 py-2.5 bg-primary-container text-on-primary-container font-body-md text-body-md font-medium rounded-lg hover:bg-primary hover:text-on-primary transition-colors shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Add Supplier
                </button>
</div>
</div>
</div>
</body></html>
