<script>
        /**
         * Simple interaction handler to simulate modal behavior
         */
        function handleClose() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.style.opacity = '0';
            backdrop.style.pointerEvents = 'none';
            backdrop.style.transition = 'opacity 0.2s ease-out';
            
            // Log for internal demonstration
            console.log('Action triggered. User status change pending server response...');
            
            // Reload visualization after short delay
            setTimeout(() => {
                backdrop.style.opacity = '1';
                backdrop.style.pointerEvents = 'auto';
            }, 2000);
        }

        // Close on escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') handleClose();
        });

        // Micro-interaction for the modal emergence
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.querySelector('[role="dialog"]');
            modal.style.opacity = '0';
            modal.style.transform = 'scale(0.95) translateY(10px)';
            
            requestAnimationFrame(() => {
                modal.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                modal.style.opacity = '1';
                modal.style.transform = 'scale(1) translateY(0)';
            });
        });
    </script>
