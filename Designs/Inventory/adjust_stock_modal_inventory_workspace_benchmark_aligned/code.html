<div class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary text-white"><span class="material-symbols-outlined">shelves</span><span class="text-sm font-medium">Inventory</span></div>
</nav>
</aside>
<div class="flex-grow flex flex-col min-h-screen">
<header class="h-16 bg-white border-b border-outline-variant flex items-center justify-between px-gutter">
<div class="flex items-center gap-4 flex-1">
<div class="bg-surface-container px-4 py-1.5 rounded-lg text-sm border border-outline-variant/30">Main Branch</div>

<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>

</div>
</div>
</header>
<main class="p-gutter">
<div class="flex justify-between items-end mb-8">
<div><h2 class="text-2xl font-bold">Inventory</h2></div>
</div>
<div class="grid grid-cols-4 gap-6 mb-10">
<div class="bg-white p-4 rounded-xl border border-outline-variant h-24"></div>
<div class="bg-white p-4 rounded-xl border border-outline-variant h-24"></div>
<div class="bg-white p-4 rounded-xl border border-outline-variant h-24"></div>
<div class="bg-white p-4 rounded-xl border border-outline-variant h-24"></div>
</div>
<div class="bg-white rounded-xl border border-outline-variant h-96"></div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-main p-margin-mobile">
<!-- Modal Container -->
<div class="bg-surface rounded-xl shadow-xl w-full max-w-[640px] overflow-hidden flex flex-col border border-outline-variant transform transition-all animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="px-md py-sm border-b border-outline-variant flex items-center justify-between bg-surface">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">tune</span>
<h2 class="font-headline-sm text-headline-sm text-primary">Adjust Stock</h2>
</div>
<button class="p-xs hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant" onclick="window.location.reload()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-md space-y-lg max-h-[819px] overflow-y-auto scrolling-touch">
<!-- Product Overview Card -->

<div class="w-16 h-16 rounded-lg overflow-hidden bg-white border border-outline-variant flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="High-resolution close-up product photograph of a premium 2-liter bottle of cooking oil with a minimalist golden label. The scene is lit with soft studio lighting that creates elegant highlights on the glass bottle. The background is a clean, creamy off-white color that matches a modern corporate light-mode dashboard aesthetic. Professional commercial photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVx1etcNGWUZiox5OI5rGiLZhsHKojbfAMV-3qDB-QYcDjy8KIYgFfmpUDIN6FCgTlOFMdYnioq5tNS8uYrFOWlMmFz4MAl6jvqjNft-CrQ9n53xEGY9VakFqwTr3zOuXhOyIWqgVVWjnj42AFdxqDmXqTCuA1D1N1D8ZSniC68WAhUMGGYaTp9SiPRtCyt3Kvzx-GDNZTFgZPNf33UT7a3gNcMFQLet_L7hFExvucLuLm0SP_JWV2JA">
</div>

<div class="col-span-3 pb-base border-b border-outline-variant/30">

<span class="text-on-surface-variant text-label-sm ml-xs">CO-201</span>
</div>
<div class="flex flex-col">
<span class="text-label-sm text-on-surface-variant uppercase">Current</span>
<span class="font-headline-sm text-headline-sm text-primary">54 <span class="text-label-md font-normal">Units</span></span>
</div>

<span class="text-label-sm text-on-surface-variant uppercase">Available</span>
<span class="font-headline-sm text-headline-sm text-primary">52 <span class="text-label-md font-normal">Units</span></span>

<!-- Adjustment Controls -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Type Selector -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Adjustment Type</label>
<div class="flex p-base bg-surface-container-high rounded-lg gap-base">
<button class="flex-1 py-xs rounded font-label-md text-label-md transition-all bg-primary-container text-on-primary-container shadow-sm" id="btn-increase" onclick="toggleType('increase')">
                                Increase
                            </button>
<button class="flex-1 py-xs rounded font-label-md text-label-md transition-all text-on-surface-variant hover:bg-surface-container-highest" id="btn-decrease" onclick="toggleType('decrease')">
                                Decrease
                            </button>
</div>
</div>
<!-- Quantity Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Quantity</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-lg px-md py-sm font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="qty-input" min="1" oninput="calculateStock()" placeholder="Enter amount" type="number" value="0">
<div class="absolute right-md top-1/2 -translate-y-1/2 flex gap-xs">
<button class="p-1 hover:bg-surface-container-high rounded text-primary transition-colors" onclick="adjustVal(1)"><span class="material-symbols-outlined text-[20px]">add</span></button>
<button class="p-1 hover:bg-surface-container-high rounded text-primary transition-colors" onclick="adjustVal(-1)"><span class="material-symbols-outlined text-[20px]">remove</span></button>
</div>
</div>
</div>
<!-- Reason Select -->
<div class="space-y-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant">Reason for Adjustment</label>
<select class="w-full bg-surface-container-lowest border-outline-variant rounded-lg px-md py-sm font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none appearance-none transition-all" id="reason-select" onchange="checkValidation()">
<option disabled="" selected="" value="">Select reason...</option>
<option value="damaged">Damaged</option>
<option value="expired">Expired</option>
<option value="lost">Lost</option>
<option value="found">Found</option>
<option value="manual">Manual Correction</option>
</select>
</div>

<div class="space-y-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant">Additional Notes</label>
<textarea class="w-full bg-surface-container-lowest border-outline-variant rounded-lg px-md py-sm font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none" id="notes-area" placeholder="Describe the reason for adjustment..." rows="3"></textarea>
</div>
</div>

<div class="flex items-center gap-sm">

<span class="material-symbols-outlined">analytics</span>
</div>
<div>
<p class="text-label-sm text-on-secondary-container uppercase">New Available Stock</p>
<p class="font-headline-sm text-headline-sm text-primary" id="new-stock-preview">52 Units</p>
</div>
</div>

<p class="text-label-sm text-on-surface-variant">Status</p>
<p class="font-label-md text-label-md text-primary flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-green-500"></span> Healthy
                        </p>
</div>
</div>

<button class="px-md py-sm border border-outline-variant text-primary rounded-lg font-label-md text-label-md hover:bg-surface-container-high transition-colors" onclick="window.location.reload()">
                    Cancel
                </button>
<button class="px-lg py-sm bg-primary text-on-primary rounded-lg font-label-md text-label-md shadow-sm hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed transition-all" disabled="true" id="save-btn">
                    Save Adjustment
                </button>
</div>
</div>
</div>
<script>
        let currentType = 'increase';
        const initialAvailable = 52;

        function toggleType(type) {
            currentType = type;
            const incBtn = document.getElementById('btn-increase');
            const decBtn = document.getElementById('btn-decrease');
            
            if (type === 'increase') {
                incBtn.className = 'flex-1 py-xs rounded font-label-md text-label-md transition-all bg-primary-container text-on-primary-container shadow-sm';
                decBtn.className = 'flex-1 py-xs rounded font-label-md text-label-md transition-all text-on-surface-variant hover:bg-surface-container-highest';
            } else {
                decBtn.className = 'flex-1 py-xs rounded font-label-md text-label-md transition-all bg-primary-container text-on-primary-container shadow-sm';
                incBtn.className = 'flex-1 py-xs rounded font-label-md text-label-md transition-all text-on-surface-variant hover:bg-surface-container-highest';
            }
            calculateStock();
        }

        function adjustVal(delta) {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) || 0;
            val = Math.max(0, val + delta);
            input.value = val;
            calculateStock();
        }

        function calculateStock() {
            const input = document.getElementById('qty-input');
            const preview = document.getElementById('new-stock-preview');
            let qty = parseInt(input.value) || 0;
            
            let newValue = currentType === 'increase' ? initialAvailable + qty : initialAvailable - qty;
            newValue = Math.max(0, newValue);
            
            preview.innerText = `${newValue} Units`;
            checkValidation();
        }

        function checkValidation() {
            const qty = parseInt(document.getElementById('qty-input').value) || 0;
            const reason = document.getElementById('reason-select').value;
            const btn = document.getElementById('save-btn');
            
            if (qty > 0 && reason !== "") {
                btn.removeAttribute('disabled');
                btn.classList.add('scale-[1.02]');
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.remove('scale-[1.02]');
            }
        }

        // Animation on load
        document.addEventListener('DOMContentLoaded', () => {
            calculateStock();
        });
    </script>
