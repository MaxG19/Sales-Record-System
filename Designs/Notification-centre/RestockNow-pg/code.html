<body class="h-full bg-background font-body-md text-on-background relative overflow-hidden">
<!-- Top App Bar (From Screen 12 context) -->
<header class="bg-surface dark:bg-surface-dim shadow-sm flex justify-between items-center px-container-padding h-16 w-full sticky top-0 z-[40] transition-colors duration-200">

</div>
<button class="hover:bg-surface-container-high dark:hover:bg-surface-container-highest rounded-full p-2 text-on-surface-variant dark:text-outline transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Background Content (Unread Notifications Screen - Blurred) -->

<div class="space-y-4 pointer-events-none">
<div class="h-20 bg-surface-container-lowest rounded-xl border border-surface-variant w-full"></div>
<div class="h-24 bg-surface-container-lowest rounded-xl border border-surface-variant w-full"></div>
<div class="h-16 bg-surface-container-lowest rounded-xl border border-surface-variant w-full"></div>

<div class="h-20 bg-surface-container-lowest rounded-xl border border-surface-variant w-full"></div>
</div>
</main>
<!-- Overlay / Modal -->
<div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-on-background/20 backdrop-blur-sm">
<div class="bg-surface-container-lowest w-full max-w-[400px] rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-surface-variant overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-200">
<!-- Modal Header -->
<div class="p-5 border-b border-surface-variant bg-surface-bright flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Restock Inventory</h2>
<button class="text-on-surface-variant hover:text-on-surface p-1 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-5 flex flex-col gap-stack-md overflow-y-auto max-h-[60vh]">
<!-- Product Summary Card -->
<div class="bg-surface-container-low rounded-lg p-4 flex gap-4 items-start border border-surface-variant">
<div class="w-12 h-12 bg-surface-variant rounded flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-outline">inventory_2</span>
</div>
<div class="flex-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface leading-tight">Premium Widgets</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">SKU: SKU-8992</p>
</div>
<span class="bg-error-container text-on-error-container font-label-md text-label-md px-2 py-1 rounded-full whitespace-nowrap">Low Stock</span>
</div>
<!-- Status Indicators Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-lowest border border-surface-variant rounded-lg p-4 flex flex-col items-center text-center">
<span class="font-body-md text-body-md text-on-surface-variant mb-1">Current Count</span>
<span class="font-stat-lg text-stat-lg text-error">12</span>
</div>
<div class="bg-surface-container-lowest border border-surface-variant rounded-lg p-4 flex flex-col items-center text-center">
<span class="font-body-md text-body-md text-on-surface-variant mb-1">Critical Threshold</span>
<span class="font-stat-lg text-stat-lg text-on-surface">50</span>
</div>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-stack-sm">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Restock Quantity</label>
<input class="w-full bg-surface-container h-12 px-4 rounded-lg border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 transition-colors font-body-lg text-body-lg text-on-surface" type="number" value="100"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Destination Branch</label>
<select class="w-full bg-surface-container h-12 px-4 rounded-lg border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 transition-colors font-body-lg text-body-lg text-on-surface appearance-none">
<option>Main Warehouse (HQ)</option>
<option>Northside Facility</option>
<option>East Wing Storage</option>
</select>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Expected Delivery Date</label>
<input class="w-full bg-surface-container h-12 px-4 rounded-lg border-transparent focus:border-primary focus:bg-surface-container-lowest focus:ring-0 transition-colors font-body-lg text-body-lg text-on-surface" type="date"/>
</div>
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="p-5 border-t border-surface-variant bg-surface-bright flex gap-4">
<button class="flex-1 h-12 rounded-lg border border-surface-variant text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">
                    Cancel
                </button>
<button class="flex-1 h-12 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-on-surface transition-colors shadow-sm">
                    Confirm Order
                </button>
</div>
</div>
</div>

<nav class="fixed bottom-0 left-0 w-full z-[40] flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline shadow-lg rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant p-2 hover:bg-surface-container dark:hover:bg-surface-container-high scale-95 active:scale-90 transition-all duration-150 rounded-xl">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">dashboard</span>
<span class="font-label-md text-label-md mt-1">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl p-2 scale-95 active:scale-90 transition-all duration-150 shadow-sm">

<span class="font-label-md text-label-md mt-1 font-bold">Orders</span>
</button>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-md text-label-md mt-1">Settings</span>
</button>
</nav>
</body></html>
