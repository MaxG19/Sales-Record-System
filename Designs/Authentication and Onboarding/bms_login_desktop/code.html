<style>
        body {
            background-color: #F7F4EC;
            background-image: radial-gradient(circle at center, rgba(216, 211, 196, 0.2) 0%, transparent 70%);

            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;

            outline-offset: 2px;

<body class="text-on-background">
<!-- Login Card Container -->
<main class="w-full max-w-[460px] p-margin-mobile md:p-0">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-none overflow-hidden">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mb-2xl">
<div class="mb-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-headline-md" style="font-variation-settings: 'FILL' 1;">business_center</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">BMS</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface mb-xs">Sign in to your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your business.</p>
</header>
<!-- Form Section -->
<form class="space-y-lg" onsubmit="return false;">
<!-- Email Address -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md font-semibold text-on-surface" for="email">Email Address</label>
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus-ring transition-all placeholder:text-outline-variant" id="email" placeholder="name@company.com" type="email">
<!-- Space for inline validation error -->
<div class="hidden font-label-sm text-label-sm text-error mt-xs" id="email-error">Please enter a valid email address.</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md font-semibold text-on-surface" for="password">Password</label>
<a class="font-body-md text-body-md text-primary-container hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full h-12 px-md pr-12 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus-ring transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors cursor-pointer" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>
<!-- Space for inline validation error -->
<div class="hidden font-label-sm text-label-sm text-error mt-xs" id="password-error">Incorrect password. Please try again.</div>
</div>
<!-- Primary Sign In -->
<button class="w-full h-[52px] bg-primary-container text-on-primary font-title-md text-title-md font-semibold rounded-xl hover:opacity-90 active:scale-[0.98] transition-all cursor-pointer" type="submit">
                    Sign In
                </button>
<!-- Divider -->
<div class="relative py-md">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-md uppercase">
<span class="bg-surface-container-lowest px-md text-outline font-semibold">OR</span>
</div>
</div>
<!-- Social Sign In -->
<button class="w-full h-[52px] border border-primary-container text-primary-container font-title-md text-title-md font-semibold rounded-xl flex items-center justify-center gap-md hover:bg-surface-container-low transition-colors cursor-pointer" type="button">
<svg fill="none" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">

                </button>

<footer class="mt-2xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to BMS? 
                    <a class="text-primary-container font-semibold hover:underline transition-all ml-xs" href="#">Create your Business</a>
</p>

</main>
<!-- Prototype Interaction Scripts -->
<script src="../prototype/js/navigation.js"></script>
<script src="../prototype/js/validation.js"></script>
<script src="../prototype/js/loading.js"></script>
<script>
        // ── Password visibility toggle ──
        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('pass-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // ── Forgot Password link ──
        document.querySelector('a[href="#"]').addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(Routes.FORGOT_PASSWORD);
        });

        // ── Create Business link ──
        document.querySelector('footer a[href="#"]').addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(Routes.WORKSPACE_SELECTION);
        });

        // ── Sign In form submission ──
        const form = document.querySelector('form');
        const signInBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const emailVal = document.getElementById('email').value;
            const passVal  = document.getElementById('password').value;

            let valid = true;

            const emailErr = Validation.email(emailVal);
            if (emailErr) {
                Validation.showError('email', emailErr);
                valid = false;
            } else {
                Validation.clearError('email');
            }

            if (!passVal || passVal.trim() === '') {
                Validation.showError('password', 'Password is required.');
                valid = false;
            } else {
                Validation.clearError('password');
            }

            if (!valid) return;

            // Simulate loading then navigate
            Loading.setButton(signInBtn, 'Signing In...');
            setTimeout(() => {
                navigateTo(Routes.WORKSPACE_SELECTION);
            }, 1200);
        });

        // ── Inline validation on blur ──
        document.getElementById('email').addEventListener('blur', function() {
            const err = Validation.email(this.value);
            if (err) Validation.showError('email', err);
            else Validation.clearError('email');
        });

        document.getElementById('password').addEventListener('blur', function() {
            if (!this.value) Validation.showError('password', 'Password is required.');
            else Validation.clearError('password');
        });

        // ── Keyboard: Enter submits ──
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
        });

        // ── Atmospheric background ──
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.backgroundImage = `radial-gradient(circle at ${x}% ${y}%, rgba(52,78,65,0.08) 0%, transparent 60%)`;
        });
    </script>


</body></html>
